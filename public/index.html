<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Leve – fat loss coach</title>
  <meta name="description" content="Gentle fat-loss coach for a sensitive gut: meal plans with quantities, weight trend, Hevy training sync and Lisbon supermarket prices.">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <script>try{var t=JSON.parse(localStorage.getItem('leve-theme')||'{}');if(t.accent)document.documentElement.dataset.accent=t.accent;if(t.mode&&t.mode!=='system')document.documentElement.dataset.mode=t.mode}catch(e){}</script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="#/today" class="brand" aria-label="Leve home"><span class="brand-mark" id="brand-mark"></span>Leve</a>
    <span id="phase-chip"></span>
    <span class="spacer"></span>
    <a href="#/products" class="icon-btn" id="btn-products" aria-label="Find products"></a>
    <a href="#/more" class="icon-btn" id="btn-more" aria-label="More"></a>
  </header>
  <main id="view"><div class="center muted mt-lg"><span class="spinner"></span></div></main>
  <nav class="bottom-nav" id="nav" aria-label="Main">
    <a href="#/today" data-nav="today" data-icon="house">Today</a>
    <a href="#/plan" data-nav="plan" data-icon="calendar-days">Plan</a>
    <a href="#/shop" data-nav="shop" data-icon="shopping-basket">Shop</a>
    <a href="#/progress" data-nav="progress" data-icon="chart-line">Progress</a>
    <a href="#/gym" data-nav="gym" data-icon="dumbbell">Gym</a>
  </nav>
  <div class="toast-wrap" id="toasts"></div>
  <div id="modal-root"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
